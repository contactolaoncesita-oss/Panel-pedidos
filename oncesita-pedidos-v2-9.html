<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos · La Oncesita</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1D9E75;--teal-d:#0F6E56;--teal-l:#E1F5EE;
  --amber:#BA7517;--amber-l:#FEF3DA;--amber-b:#F0C05A;
  --red:#D85A30;--red-l:#FAECE7;
  --ink:#1A2827;--ink2:#3E5453;--ink3:#7A9897;
  --bg:#F0F4F3;--white:#fff;--border:#DCE6E5;
  --r:12px;--rs:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.header{background:var(--teal-d);padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.header-brand{color:#fff}
.header-brand .name{font-size:18px;font-weight:800}
.header-brand .sub{font-size:11px;color:rgba(255,255,255,.65);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.header-actions{display:flex;gap:8px;align-items:center}
.main{padding:20px;max-width:1000px;margin:0 auto}
.config-bar{background:var(--amber-l);border:1px solid var(--amber-b);border-radius:var(--rs);padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--amber)}
.config-bar input{flex:1;font-size:12px;padding:6px 10px;border:1px solid var(--amber-b);border-radius:6px;background:#fff;color:var(--ink);font-family:monospace}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.metric-lbl{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.metric-val{font-size:22px;font-weight:800;color:var(--ink)}
.metric-val.green{color:var(--teal-d)}.metric-val.red{color:var(--red)}.metric-val.amber{color:var(--amber)}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--border);padding:4px;border-radius:var(--rs);width:fit-content}
.tab{padding:7px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--ink3);transition:all .15s}
.tab.active{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--ink3);font-size:13px}
.empty i{font-size:36px;display:block;margin-bottom:8px;opacity:.35}
.pedido-card{border:1px solid var(--border);border-radius:var(--rs);padding:14px 16px;margin-bottom:10px;transition:border .15s}
.pedido-card:hover{border-color:var(--teal)}
.pedido-card.pendiente{border-left:4px solid var(--amber)}
.pedido-card.pagado{border-left:4px solid var(--teal);opacity:.6}
.pedido-card.cancelado{border-left:4px solid var(--ink3);opacity:.4}
.pedido-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pedido-id{font-size:11px;font-family:monospace;color:var(--ink3);margin-bottom:2px}
.pedido-cliente{font-size:15px;font-weight:700;color:var(--ink)}
.pedido-fecha{font-size:12px;color:var(--ink3);margin-top:2px}
.pedido-prods{font-size:12px;color:var(--ink2);margin:8px 0;line-height:1.5;padding:8px 10px;background:var(--bg);border-radius:6px}
.pedido-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
.pedido-total{font-size:16px;font-weight:800;color:var(--teal-d)}
.pedido-total small{font-size:11px;font-weight:400;color:var(--ink3);margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.pendiente{background:var(--amber-l);color:var(--amber)}
.badge.pagado{background:var(--teal-l);color:var(--teal-d)}
.badge.cancelado{background:#F3F4F6;color:var(--ink3)}
.actions{display:flex;gap:6px}
.btn{padding:7px 14px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--ink);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.primary:hover{background:var(--teal-d)}
.btn.danger{background:var(--red-l);color:var(--red);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:11px}
input,select{width:100%;font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:var(--rs);background:var(--white);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--teal)}
label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:4px}
.fg{margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--white);border-radius:var(--r);padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--ink)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--teal-d)}
.toast.error{background:var(--red)}
@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="name">La Oncesita</div>
    <div class="sub">Gestión de pedidos</div>
  </div>
  <div class="header-actions">
    <button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)" onclick="cargarTodo()">
      <i class="ti ti-refresh"></i> Actualizar
    </button>
  </div>
</div>

<div class="main">

  <!-- Configuración URL -->
  <div class="config-bar" id="config-bar">
    <i class="ti ti-settings"></i>
    <span>Script Pedidos:</span>
    <input id="script-url" placeholder="https://script.google.com/macros/s/.../exec" oninput="guardarURL()">
    <span style="white-space:nowrap;margin-left:12px">Script Finanzas:</span>
    <input id="finanzas-url" placeholder="https://script.google.com/macros/s/.../exec" oninput="guardarFinanzasURL()" style="flex:1">
    <button class="btn sm" onclick="cargarTodo()" style="white-space:nowrap"><i class="ti ti-plug-connected"></i> Conectar</button>
  </div>

  <!-- Métricas -->
  <div class="metrics" id="metrics">
    <div class="metric"><div class="metric-lbl">Pedidos pendientes</div><div class="metric-val amber" id="m-pendientes">—</div></div>
    <div class="metric"><div class="metric-lbl">Ingresos del mes</div><div class="metric-val green" id="m-ingresos">—</div></div>
    <div class="metric"><div class="metric-lbl">Gastos del mes</div><div class="metric-val red" id="m-gastos">—</div></div>
    <div class="metric"><div class="metric-lbl">Resultado neto</div><div class="metric-val" id="m-neto">—</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setTab('pendientes')">Pendientes de cobro</button>
    <button class="tab" onclick="setTab('todos')">Todos los pedidos</button>
  </div>

  <!-- Panel pendientes -->
  <div id="panel-pendientes">
    <div id="lista-pendientes"><div class="empty"><i class="ti ti-clock"></i>Cargando pedidos…</div></div>
  </div>

  <!-- Panel todos -->
  <div id="panel-todos" style="display:none">
    <div id="lista-todos"><div class="empty"><i class="ti ti-list"></i>Cargando…</div></div>
  </div>

</div>

<!-- Modal confirmar pago -->
<div class="modal-overlay" id="modal-pago" style="display:none">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-circle-check" style="color:var(--teal)"></i> Confirmar pago recibido</div>
    <input type="hidden" id="pago-id">
    <div class="fg">
      <label>Cliente</label>
      <input id="pago-cliente" readonly style="background:var(--bg)">
    </div>
    <div class="fg">
      <label>Monto neto</label>
      <input id="pago-monto" readonly style="background:var(--bg);font-weight:700;color:var(--teal-d)">
    </div>
    <div class="form-row">
      <div class="fg">
        <label>Fecha de pago</label>
        <input type="date" id="pago-fecha">
      </div>
      <div class="fg">
        <label>Método de pago</label>
        <select id="pago-metodo">
          <option>Transferencia Bancaria</option>
          <option>Tarjeta</option>
          <option>Efectivo</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary" id="btn-confirmar" onclick="ejecutarConfirmarPago()">
        <i class="ti ti-check"></i> Confirmar y registrar ingreso
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const STORAGE_URL_KEY = 'oncesita_script_url';
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwI1bP1M0M1d2gX-rusFGUcmC2r2IyOc2NlfnP2VT4q5rCyUGwYUJGOG3f9MOcos7sM/exec';
let todosLosPedidos = [];
let tabActual = 'pendientes';

// ── URL ──────────────────────────────────────────────────
function getURL() { return 'https://script.google.com/macros/s/AKfycbysdW7WaIwjDXIhGlYyAL27Ixngj7tRDz8w8nU7kxltDQCHaWxLySaJ-VU3iepRqmeKyg/exec'; }
function guardarURL() {
  const url = document.getElementById('script-url').value.trim();
  if (url) localStorage.setItem(STORAGE_URL_KEY, url);
}

function guardarFinanzasURL() {
  const furl = document.getElementById('finanzas-url').value.trim();
  localStorage.setItem('oncesita_finanzas_url', furl);
}

function getFinanzasURL() { return 'https://script.google.com/macros/s/AKfycbwLSr8VWRwFrnZMwGGSAUphfhla3tqRcozTRYNo52Dl7tWqg82d-lG4kkTGtBNKaKe0/exec'; }

// ── Utils ─────────────────────────────────────────────────
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');
const today = () => new Date().toISOString().slice(0,10);

function toast(msg, tipo='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 3000);
}

// ── Tabs ──────────────────────────────────────────────────
function setTab(tab) {
  tabActual = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[tab === 'pendientes' ? 0 : 1].classList.add('active');
  document.getElementById('panel-pendientes').style.display = tab === 'pendientes' ? 'block' : 'none';
  document.getElementById('panel-todos').style.display = tab === 'todos' ? 'block' : 'none';
  renderPedidos();
}

// ── Cargar datos ──────────────────────────────────────────
async function cargarTodo() {
  const furl = getFinanzasURL();
  if (!furl) { toast('Error de configuración', 'error'); return; }

  try {
    // Pedidos y resumen desde FINANZAS ONCESITA
    const [r1, r2] = await Promise.all([
      fetch(furl + '?action=resumen'),
      fetch(furl + '?action=pedidos')
    ]);
    const d1 = await r1.json();
    const d2 = await r2.json();

    if (d1.ok && d1.resumen) {
      const s = d1.resumen;
      document.getElementById('m-pendientes').textContent = s.pedidos_pendientes || 0;
      document.getElementById('m-ingresos').textContent = fmt(s.ingresos_mes || 0);
      document.getElementById('m-gastos').textContent = fmt(s.gastos_mes || 0);
      const neto = document.getElementById('m-neto');
      neto.textContent = fmt(s.neto_mes || 0);
      neto.className = 'metric-val ' + ((s.neto_mes || 0) >= 0 ? 'green' : 'red');
    }

    if (d2.ok) {
      todosLosPedidos = d2.pedidos;
      renderPedidos();
    }
  } catch(e) {
    toast('Error al conectar: ' + e.message, 'error');
  }
}

function renderPedidos() {
  const filtro = tabActual === 'pendientes' ? 'PENDIENTE' : null;
  const lista = filtro
    ? todosLosPedidos.filter(p => p.ESTADO === 'PENDIENTE')
    : todosLosPedidos;

  const elId = tabActual === 'pendientes' ? 'lista-pendientes' : 'lista-todos';
  const el = document.getElementById(elId);

  if (!lista.length) {
    el.innerHTML = `<div class="empty"><i class="ti ti-${tabActual === 'pendientes' ? 'circle-check' : 'list'}"></i>${tabActual === 'pendientes' ? 'No hay pedidos pendientes de cobro. ¡Todo al día!' : 'Sin pedidos registrados.'}</div>`;
    return;
  }

  el.innerHTML = lista.sort((a,b) => (b.FECHA_ENTREGA||'').localeCompare(a.FECHA_ENTREGA||'')).map(p => `
    <div class="pedido-card ${(p.ESTADO||'').toLowerCase()}">
      <div class="pedido-head">
        <div>
          <div class="pedido-id">${p.ID_PEDIDO || ''}</div>
          <div class="pedido-cliente">${p.CLIENTE || 'Sin nombre'}</div>
          <div class="pedido-fecha">
            <i class="ti ti-calendar" style="font-size:11px"></i>
            Pedido: ${formatFecha(p.FECHA_PEDIDO)} · Entrega: ${formatFecha(p.FECHA_ENTREGA)}
          </div>
        </div>
        <span class="badge ${(p.ESTADO||'pendiente').toLowerCase()}">${p.ESTADO || 'PENDIENTE'}</span>
      </div>
      <div class="pedido-prods">${(p.PRODUCTOS || '').replace(/\|/g, '·')}</div>
      <div class="pedido-footer">
        <div class="pedido-total">
          ${fmt(p.TOTAL_NETO || 0)}
          <small>neto · bruto ${fmt(p.TOTAL_BRUTO || 0)}</small>
        </div>
        ${p.ESTADO === 'PENDIENTE' ? `
        <div class="actions">
          <button class="btn primary" onclick="abrirModalPago('${p.ID_PEDIDO}','${p.CLIENTE}',${p.TOTAL_NETO},${p.TOTAL_BRUTO})">
            <i class="ti ti-cash"></i> Confirmar pago
          </button>
          <button class="btn danger sm" onclick="cancelarPedido('${p.ID_PEDIDO}')">
            <i class="ti ti-x"></i>
          </button>
        </div>` : p.ESTADO === 'PAGADO' ? `
        <div style="font-size:12px;color:var(--ink3)">
          <i class="ti ti-check" style="color:var(--teal)"></i>
          Pagado el ${formatFecha(p.FECHA_PAGO)} · ${p.METODO_PAGO || ''}
        </div>` : ''}
      </div>
    </div>`).join('');
}

function formatFecha(f) {
  if (!f) return '—';
  try {
    const d = new Date(f + 'T12:00:00');
    return d.toLocaleDateString('es-CL', {day:'2-digit', month:'short', year:'numeric'});
  } catch { return f; }
}

// ── Modal pago ────────────────────────────────────────────
function abrirModalPago(id, cliente, neto, bruto) {
  document.getElementById('pago-id').value = id;
  document.getElementById('pago-cliente').value = cliente;
  document.getElementById('pago-monto').value = fmt(neto) + ' neto (bruto ' + fmt(bruto) + ')';
  document.getElementById('pago-fecha').value = today();
  document.getElementById('modal-pago').style.display = 'flex';
}

function cerrarModal() {
  document.getElementById('modal-pago').style.display = 'none';
}

async function ejecutarConfirmarPago() {
  const url = getURL();
  if (!url) { toast('Configura la URL primero', 'error'); return; }

  const id = document.getElementById('pago-id').value;
  const fecha = document.getElementById('pago-fecha').value;
  const metodo = document.getElementById('pago-metodo').value;

  const btn = document.getElementById('btn-confirmar');
  btn.innerHTML = '<span class="spinner"></span> Registrando…';
  btn.disabled = true;

  try {
    // Confirmar pago en FINANZAS ONCESITA (marca PAGADO + escribe en DETALLE)
    const furl = getFinanzasURL();
    if (!furl) { toast('URL de Finanzas no configurada', 'error'); return; }

    const pedido = todosLosPedidos.find(p => p.ID_PEDIDO === id) || {};
    await fetch(furl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'confirmar_pago',
        id_pedido: id,
        fecha_pago: fecha,
        metodo_pago: metodo,
        cliente: pedido.CLIENTE || '',
        total_neto: pedido.TOTAL_NETO || 0,
        total_bruto: pedido.TOTAL_BRUTO || 0,
        canal: pedido.CANAL || 'Formulario web'
      })
    });

    toast('✓ Pago confirmado y registrado en Finanzas', 'success');
    cerrarModal();
    await cargarTodo();
  } catch(e) {
    toast('Error de conexión: ' + e.message, 'error');
  } finally {
    btn.innerHTML = '<i class="ti ti-check"></i> Confirmar y registrar ingreso';
    btn.disabled = false;
  }
}

async function cancelarPedido(id) {
  if (!confirm('¿Cancelar este pedido? No se registrará ningún ingreso.')) return;
  const url = getURL();
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'cancelar_pedido', id_pedido: id })
    });
    toast('Pedido cancelado', 'success');
    await cargarTodo();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

// ── Inicio ────────────────────────────────────────────────
function init() {
  const url = getURL();
  document.getElementById('script-url').value = url;
  const furl = getFinanzasURL();
  if (furl) document.getElementById('finanzas-url').value = furl;
  if (url) cargarTodo();
}

init();
</script>
</body>
</html>
